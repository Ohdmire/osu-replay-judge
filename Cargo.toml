[package]
name = "osu_replay_judge"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "osu!standard replay judge: a Rust reimplementation of osu!lazer judgement, per-event exact (score/combo/accuracy/unstable rate)"
readme = "README.md"
repository = "https://github.com/Ohdmire/osu-replay-judge"
keywords = ["osu", "replay", "judgement", "beatmap", "lazer"]
categories = ["game-development"]

[dependencies]
# Shared .osu/.osr parsing + processing pipeline (sibling checkout; when
# publishing, osu-parse must be published first).
osu-parse = { path = "../osu-parse" }
